<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upvote Widget - Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        color: #333;
      }
      h1 { color: #6366f1; }
      p { line-height: 1.6; }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Upvote Widget - Pagina de Demo</h1>
    <p>
      Esta pagina demonstra o widget Upvote. Clique no botao flutuante no canto
      inferior direito para abrir o board de feedback.
    </p>
    <p>
      O widget e configurado com os atributos <code>data-product-slug</code> e
      <code>data-color</code> no script tag.
    </p>

    <!-- Widget Upvote -->
    <script
      type="module"
      src="/src/main.ts"
      data-product-slug="produto-demo"
      data-color="#6366f1"
      data-base-url="http://localhost:5173">
    </script>
  </body>
</html>
