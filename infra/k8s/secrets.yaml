apiVersion: v1
kind: Secret
metadata:
  name: upvote-secrets
  namespace: upvote
type: Opaque
data:
  # ATENÇÃO: Este arquivo contém apenas placeholders vazios.
  # Os valores reais são injetados via apply-secrets.sh a partir do .env
  # Nunca commite credenciais reais aqui!

  # PostgreSQL (Neon.tech)
  DB_HOST: ""
  DB_PORT: ""
  DB_NAME: ""
  DB_USERNAME: ""
  DB_PASSWORD: ""

  # JWT
  JWT_SECRET: ""
  JWT_EXPIRATION: ""

  # Mail
  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

  # CORS
  CORS_ORIGINS: ""

  # RabbitMQ
  RABBITMQ_USER: ""
  RABBITMQ_PASSWORD: ""

  # Stripe
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_STARTER_PRICE_ID: ""
  STRIPE_PRO_PRICE_ID: ""