apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upvote-ingress
  namespace: upvote
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.upvote.pro
        - api.upvote.pro
      secretName: upvote-tls
  rules:
    - host: app.upvote.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    - host: api.upvote.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
