apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upvote-ingress
  namespace: upvote
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.upvote.com
        - api.upvote.com
      secretName: upvote-tls
  rules:
    - host: app.upvote.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
    - host: api.upvote.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
