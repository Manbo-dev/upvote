apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: upvote
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api
          image: europe-west1-docker.pkg.dev/project-38c32df4-c37c-41d9-b5d/upvote/api:latest
          ports:
            - containerPort: 8080
          env:
            # PostgreSQL (Neon.tech)
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: DB_PASSWORD
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: JWT_EXPIRATION
            # Mail
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: MAIL_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: MAIL_FROM
            # CORS
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: CORS_ORIGINS
            # RabbitMQ
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: RABBITMQ_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: RABBITMQ_PASSWORD
            # Stripe
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_STARTER_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: STRIPE_STARTER_PRICE_ID
            - name: STRIPE_PRO_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: STRIPE_PRO_PRICE_ID
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: GEMINI_API_KEY
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: GOOGLE_CLIENT_ID
            # Jira Integration
            - name: JIRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: JIRA_CLIENT_ID
            - name: JIRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: JIRA_CLIENT_SECRET
            # ClickUp Integration
            - name: CLICKUP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: CLICKUP_CLIENT_ID
            - name: CLICKUP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: CLICKUP_CLIENT_SECRET
            # OAuth Callback Base URL
            - name: OAUTH_CALLBACK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: upvote-secrets
                  key: OAUTH_CALLBACK_BASE_URL
            # Redis
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # Ativa o perfil de produção → logs JSON estruturado para Cloud Logging
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: upvote
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer