# Grafana Alloy — scrapes Prometheus metrics and collects logs, sends to Grafana Cloud
alloy:
  configMap:
    create: true
    content: |
      // ==================== METRICS ====================

      // Discover pods with prometheus.io annotations in the upvote namespace
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["upvote"]
        }
      }

      // Filter to only pods with prometheus.io/scrape=true
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          separator     = ":"
          target_label  = "__address__"
          regex         = "(.+):(.+)"
          replacement   = "$1:$2"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // Scrape the discovered targets
      prometheus.scrape "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [prometheus.remote_write.grafanacloud.receiver]

        scrape_interval = "30s"
      }

      // Remote write metrics to Grafana Cloud
      prometheus.remote_write "grafanacloud" {
        endpoint {
          url = "https://prometheus-prod-68-prod-eu-west-6.grafana.net/api/prom/push"

          basic_auth {
            username = env("GRAFANA_CLOUD_USERNAME")
            password = env("GRAFANA_CLOUD_PASSWORD")
          }
        }
      }

      // ==================== LOGS ====================

      // Discover pods for log collection
      discovery.kubernetes "log_pods" {
        role = "pod"
        namespaces {
          names = ["upvote"]
        }
      }

      // Add labels from Kubernetes metadata
      discovery.relabel "log_pods" {
        targets = discovery.kubernetes.log_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // Collect logs from pod containers
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.log_pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // Process logs: detect JSON and extract severity as label
      loki.process "pods" {
        // Try to parse JSON — extracts fields for JSON lines, no-op for plain text
        stage.json {
          expressions = {
            severity = "severity",
            message  = "message",
          }
        }

        // Promote severity to a label (enables filtering by severity in Grafana)
        stage.labels {
          values = {
            level = "severity",
          }
        }

        stage.static_labels {
          values = {
            cluster = "upvote-cluster",
          }
        }

        // For JSON logs: rewrite the log line as a clean one-liner
        // For non-JSON logs: keep the original line (stage.output only runs if template produces content)
        stage.output {
          source = "message"
        }

        forward_to = [loki.write.grafanacloud.receiver]
      }

      // Send logs to Grafana Cloud Loki
      loki.write "grafanacloud" {
        endpoint {
          url = "https://logs-prod-043.grafana.net/loki/api/v1/push"

          basic_auth {
            username = env("LOKI_USERNAME")
            password = env("GRAFANA_CLOUD_PASSWORD")
          }
        }
      }

  extraEnv:
    - name: GRAFANA_CLOUD_USERNAME
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: username
    - name: GRAFANA_CLOUD_PASSWORD
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: password
    - name: LOKI_USERNAME
      valueFrom:
        secretKeyRef:
          name: grafana-cloud-credentials
          key: loki-username

  mounts:
    varlog: true

controller:
  type: daemonset

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  create: true
  name: alloy

rbac:
  create: true
