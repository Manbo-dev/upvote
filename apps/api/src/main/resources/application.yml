spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:upvote}
    username: ${DB_USERNAME:upvote}
    password: ${DB_PASSWORD:upvote123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    repair-on-migrate: true
    ignore-missing-migrations: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@upvote.pro}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# Configurações JWT
app:
  jwt:
    secret: ${JWT_SECRET:upvote-secret-key-for-development-only-change-in-production-must-be-at-least-256-bits-long}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  gemini:
    # Set GEMINI_API_KEY to enable real AI. Empty value = StubAiService fallback is used.
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash-lite
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    starter-price-id: ${STRIPE_STARTER_PRICE_ID:price_placeholder}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:price_placeholder}
  google:
    # Set GOOGLE_CLIENT_ID to validate the aud claim on Google ID tokens.
    client-id: ${GOOGLE_CLIENT_ID:}
  integrations:
    jira:
      client-id: ${JIRA_CLIENT_ID:}
      client-secret: ${JIRA_CLIENT_SECRET:}
    clickup:
      client-id: ${CLICKUP_CLIENT_ID:}
      client-secret: ${CLICKUP_CLIENT_SECRET:}
    oauth-callback-base-url: ${OAUTH_CALLBACK_BASE_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: upvote-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    mail:
      enabled: true

logging:
  # Nível padrão da aplicação
  level:
    root: INFO
    com.upvote: INFO
  # Em produção o formato é controlado pelo logback-spring.xml (JSON estruturado)
  # Em dev usa o padrão colorido do Spring Boot
