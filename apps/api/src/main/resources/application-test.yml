spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-at-least-256-bits-long-for-hmac-sha
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173
