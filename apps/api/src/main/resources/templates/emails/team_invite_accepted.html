<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Convite aceito — Upvote</title>
  <style>
    body { margin: 0; padding: 0; background: #faf9f7; font-family: 'DM Sans', Arial, sans-serif; color: #2d2420; }
    .container { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .header { background: #1F5C45; padding: 32px 40px; text-align: center; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .body { padding: 36px 40px; }
    .body p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #3d3330; }
    .body strong { color: #1F5C45; }
    .cta { text-align: center; margin: 28px 0; }
    .cta a { display: inline-block; background: #1F5C45; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; }
    .footer { padding: 20px 40px; border-top: 1px solid #f0ede8; text-align: center; font-size: 12px; color: #8c7b6b; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Upvote</h1>
  </div>
  <div class="body">
    <p>Olá, <span th:text="${ownerName}">você</span>!</p>
    <p><strong th:text="${acceptingUserName}">Um usuário</strong> aceitou seu convite e agora faz parte do seu workspace no Upvote.</p>
    <p>Gerencie sua equipe na página de configurações:</p>
    <div class="cta">
      <a th:href="${teamUrl}">Ver equipe</a>
    </div>
  </div>
  <div class="footer">
    Upvote · Feedback sem ruído.
  </div>
</div>
</body>
</html>
