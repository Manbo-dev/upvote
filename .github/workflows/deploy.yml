name: Deploy to Production

on:
  push:
    branches: [main]

env:
  PROJECT_ID: project-38c32df4-c37c-41d9-b5d
  REGION: europe-west1
  CLUSTER_NAME: upvote-cluster
  NAMESPACE: upvote
  REPO_NAME: upvote
  IMAGE_NAME: api
  REGISTRY: europe-west1-docker.pkg.dev

jobs:
  # -------------------------------------------
  # 1. SOURCE - Detecta mudancas e valida
  # -------------------------------------------
  source:
    name: Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      api_changed: ${{ steps.filter.outputs.api }}
      web_changed: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Detectar mudancas por contexto
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'infra/k8s/**'
            web:
              - 'apps/web/**'

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

  # -------------------------------------------
  # 2. BUILD API - Docker build & push
  # -------------------------------------------
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: source
    if: needs.source.outputs.api_changed == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Autenticar no Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGISTRY }}" --quiet

      - name: Build e push da imagem Docker
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
          docker build \
            --platform linux/amd64 \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            -f apps/api/Dockerfile \
            apps/api
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  # -------------------------------------------
  # 3. BUILD WEB - Vercel build
  # -------------------------------------------
  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: source
    if: needs.source.outputs.web_changed == 'true'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: apps/web

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Pull configuracoes da Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build do projeto
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Salvar output do build
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: apps/web/.vercel/output
          retention-days: 1

  # -------------------------------------------
  # 4. DEPLOY API - Infra + rollout no GKE
  # -------------------------------------------
  deploy-api:
    name: Deploy API (GKE)
    runs-on: ubuntu-latest
    needs: [source, build-api]
    if: needs.source.outputs.api_changed == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Conectar ao cluster GKE
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Aplicar namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: Aplicar secrets do Google Secret Manager
        run: bash infra/k8s/apply-secrets.sh

      - name: Aplicar RabbitMQ e Redis
        run: |
          kubectl apply -f infra/k8s/rabbitmq.yaml
          kubectl apply -f infra/k8s/redis.yaml

      - name: Atualizar imagem no deployment com SHA do commit
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}"
          sed -i "s|image: .*api:.*|image: ${IMAGE}:${{ github.sha }}|" infra/k8s/deployment.yaml
          kubectl apply -f infra/k8s/deployment.yaml

      - name: Aplicar HPA
        run: kubectl apply -f infra/k8s/hpa.yaml

      - name: Aguardar rollout da API
        run: kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Exibir status dos pods
        if: always()
        run: kubectl get pods -n ${{ env.NAMESPACE }}

  # -------------------------------------------
  # 5. DEPLOY WEB - Vercel production 
  # -------------------------------------------
  deploy-web:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [source, build-web]
    if: needs.source.outputs.web_changed == 'true'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Restaurar output do build
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: apps/web/.vercel/output

      - name: Deploy para producao
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
